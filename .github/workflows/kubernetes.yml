name: Kubernetes CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - kubernetes/**
      - .github/workflows/kubernetes.yml
  pull_request:
    paths:
      - kubernetes/**
      - .github/workflows/kubernetes.yml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Install kind
        run: |
          curl -sLo /tmp/kind \
            https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version

      - name: Install Helm
        run: |
          curl -sSL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz \
            | tar xz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Start Kubernetes cluster
        run: ./kubernetes/start.sh

      - name: Test Kubernetes cluster
        run: ./kubernetes/test.sh

      - name: Debug cluster state
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -n default -o wide || true
          echo "=== Services ==="
          kubectl get svc -n default || true
          echo "=== arcadedb-0 logs ==="
          kubectl logs arcadedb-0 -n default --tail=80 || true
          echo "=== arcadedb-1 logs ==="
          kubectl logs arcadedb-1 -n default --tail=80 || true
          echo "=== arcadedb-2 logs ==="
          kubectl logs arcadedb-2 -n default --tail=80 || true

      - name: Tear down
        if: always()
        run: kind delete cluster --name arcadedb

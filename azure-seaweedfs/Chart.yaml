apiVersion: v2
name: arcadedb-azure-seaweedfs
description: Wrapper chart for the ArcadeDB on SeaweedFS + (emulated) Azure Blob showcase scenario
type: application
version: 0.1.0
dependencies:
- name: seaweedfs
  version: 4.51.0
  repository: https://seaweedfs.github.io/seaweedfs/helm
- name: seaweedfs-csi-driver
  version: 0.2.40
  repository: https://seaweedfs.github.io/seaweedfs-csi-driver/helm
- name: arcadedb
  version: 26.10.2
  repository: https://helm.arcadedb.com
  condition: arcadedb.enabled

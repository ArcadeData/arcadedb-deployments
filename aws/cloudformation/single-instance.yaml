AWSTemplateFormatVersion: '2010-09-09'
Description: 'ArcadeDB Single Instance Deployment from AWS Marketplace'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Instance Configuration
        Parameters:
          - AmiId
          - InstanceType
          - KeyName
          - CreateIamResources
          - ArcadeDBVersion
      - Label:
          default: Network Configuration
        Parameters:
          - VpcId
          - SubnetId
          - ExistingSecurityGroupId
          - AllowedCIDR
      - Label:
          default: Storage Configuration
        Parameters:
          - VolumeSize
          - VolumeType
          - EnableEncryption
      - Label:
          default: ArcadeDB Configuration
        Parameters:
          - ArcadeDBRootPassword
          - ArcadeDBServerMode
          - ArcadeDBHttpPort
          - ArcadeDBPlugins
          - ArcadeDBMaxRAM
          - ArcadeDBJavaOpts

    ParameterLabels:
      AmiId:
        default: ArcadeDB AMI ID
      ExistingSecurityGroupId:
        default: Existing Security Group ID
      CreateIamResources:
        default: Create IAM Role and Recovery Alarm
      InstanceType:
        default: EC2 Instance Type
      KeyName:
        default: SSH Key Pair
      VpcId:
        default: VPC ID
      SubnetId:
        default: Subnet ID
      AllowedCIDR:
        default: Allowed CIDR Block
      ArcadeDBRootPassword:
        default: Root Password
      ArcadeDBServerMode:
        default: Server Mode
      ArcadeDBHttpPort:
        default: HTTP Port
      ArcadeDBPlugins:
        default: Plugins
      ArcadeDBMaxRAM:
        default: Max RAM (MB)
      ArcadeDBJavaOpts:
        default: Additional JVM Settings

Parameters:
  InstanceType:
    Description: EC2 instance type. Must match the AMI architecture (x86_64 types for the amd64 AMI, t4g/m7g/r7g/c7g for the arm64 AMI)
    Type: String
    Default: m6i.large
    AllowedValues:
      - t3.medium
      - t3.large
      - t3.xlarge
      - m6i.large
      - m6i.xlarge
      - m6i.2xlarge
      - m6i.4xlarge
      - m7i.large
      - m7i.xlarge
      - m7i.2xlarge
      - m7i.4xlarge
      - r6i.large
      - r6i.xlarge
      - r6i.2xlarge
      - r6i.4xlarge
      - r7i.large
      - r7i.xlarge
      - r7i.2xlarge
      - r7i.4xlarge
      - c6i.large
      - c6i.xlarge
      - c6i.2xlarge
      - c6i.4xlarge
      - c7i.large
      - c7i.xlarge
      - c7i.2xlarge
      - c7i.4xlarge
      - t4g.medium
      - t4g.large
      - t4g.xlarge
      - m7g.large
      - m7g.xlarge
      - m7g.2xlarge
      - m7g.4xlarge
      - r7g.large
      - r7g.xlarge
      - r7g.2xlarge
      - r7g.4xlarge
      - c7g.large
      - c7g.xlarge
      - c7g.2xlarge
      - c7g.4xlarge
    ConstraintDescription: Must be a valid EC2 instance type

  AmiId:
    Description: >-
      ArcadeDB AMI ID for this region. Use the amd64 AMI with x86_64 instance types and the
      arm64 AMI with Graviton (t4g, m7g, r7g, c7g) instance types.
    Type: AWS::EC2::Image::Id

  KeyName:
    Description: Name of an existing EC2 KeyPair for SSH access. Leave empty to launch without SSH key access
    Type: String
    Default: ''

  VpcId:
    Description: VPC ID where ArcadeDB will be deployed
    Type: AWS::EC2::VPC::Id

  SubnetId:
    Description: Subnet ID for ArcadeDB instance (must be in selected VPC)
    Type: AWS::EC2::Subnet::Id

  ExistingSecurityGroupId:
    Description: Pre-created security group ID. Leave empty to create one
    Type: String
    Default: ''
    AllowedPattern: '^(sg-[0-9a-f]{8,17})?$'

  AllowedCIDR:
    Description: CIDR block allowed to access ArcadeDB (e.g., 10.0.0.0/16 or your IP/32). Only used when a security group is created
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$'

  VolumeSize:
    Description: Size of the EBS volume in GB
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 16384

  VolumeType:
    Description: EBS volume type
    Type: String
    Default: gp3
    AllowedValues:
      - gp3
      - gp2
      - io2

  EnableEncryption:
    Description: Enable EBS volume encryption
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  CreateIamResources:
    Description: Create the IAM role, instance profile and CloudWatch recovery alarm. Set to false for minimal-permission deployments
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  ArcadeDBVersion:
    Description: ArcadeDB version (informational tag)
    Type: String
    Default: '26.11.1'

  ArcadeDBRootPassword:
    Description: >-
      Root password for ArcadeDB (8+ chars with lowercase, uppercase, a number and one of @!#^+=._&-).
      Other characters are rejected because the password is passed through the shell and systemd.
      It is stored in the instance user data, so change it after the first login.
    Type: String
    NoEcho: true
    MinLength: 8
    AllowedPattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@!#^+=._&-])[A-Za-z\d@!#^+=._&-]{8,}$'
    ConstraintDescription: Must contain lowercase, uppercase, a number and one of @!#^+=._&- (no other characters)

  ArcadeDBServerMode:
    Description: ArcadeDB server mode
    Type: String
    Default: production
    AllowedValues:
      - development
      - test
      - production

  ArcadeDBHttpPort:
    Description: HTTP port for ArcadeDB API and Studio
    Type: String
    Default: '2480'

  ArcadeDBPlugins:
    Description: >-
      Comma-separated list of plugins, e.g.
      Postgres:com.arcadedb.postgres.PostgresProtocolPlugin
    Type: String
    Default: ''

  ArcadeDBMaxRAM:
    Description: Max heap size in MB (sets JVM -Xmx)
    Type: String
    Default: '2048'

  ArcadeDBJavaOpts:
    Description: >-
      Additional -Darcadedb.* JVM flags for advanced tuning
      (appended as-is to ARCADEDB_SETTINGS)
    Type: String
    Default: ''

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]
  CreateSecurityGroup: !Equals [!Ref ExistingSecurityGroupId, '']
  CreateIam: !Equals [!Ref CreateIamResources, 'true']

Resources:
  ArcadeDBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateSecurityGroup
    Properties:
      GroupDescription: Security group for ArcadeDB instance
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ArcadeDBHttpPort
          ToPort: !Ref ArcadeDBHttpPort
          CidrIp: !Ref AllowedCIDR
          Description: ArcadeDB HTTP API
        - IpProtocol: tcp
          FromPort: 2484
          ToPort: 2484
          CidrIp: !Ref AllowedCIDR
          Description: ArcadeDB HTTPS API
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedCIDR
          Description: SSH access
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sg'

  ArcadeDBRole:
    Type: AWS::IAM::Role
    Condition: CreateIam
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-role'

  ArcadeDBInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: CreateIam
    Properties:
      Roles:
        - !Ref ArcadeDBRole

  # Requires IMDSv2 (session tokens) on the instance. AWS::EC2::Instance cannot set this itself.
  ArcadeDBLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 1

  ArcadeDBInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref 'AWS::NoValue']
      IamInstanceProfile: !If [CreateIam, !Ref ArcadeDBInstanceProfile, !Ref 'AWS::NoValue']
      SubnetId: !Ref SubnetId
      LaunchTemplate:
        LaunchTemplateId: !Ref ArcadeDBLaunchTemplate
        Version: !GetAtt ArcadeDBLaunchTemplate.LatestVersionNumber
      SecurityGroupIds:
        - !If [CreateSecurityGroup, !Ref ArcadeDBSecurityGroup, !Ref ExistingSecurityGroupId]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: !Ref VolumeType
            Encrypted: !Ref EnableEncryption
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          systemctl stop arcadedb || true

          # The image generates a random root password on first boot. Replace it with the
          # one chosen in this stack: drop the users file the first start may have created.
          rm -f /opt/arcadedb/config/server-users.jsonl /home/ubuntu/arcadedb-root-password.txt

          # Build ARCADEDB_SETTINGS from named CF parameters
          SETTINGS="-Darcadedb.server.rootPassword=${ArcadeDBRootPassword}"
          SETTINGS="$SETTINGS -Darcadedb.server.databaseDirectory=/var/lib/arcadedb/databases"
          SETTINGS="$SETTINGS -Darcadedb.server.backupDirectory=/var/lib/arcadedb/backups"
          SETTINGS="$SETTINGS -Darcadedb.server.mode=${ArcadeDBServerMode}"
          SETTINGS="$SETTINGS -Darcadedb.server.httpIncomingPort=${ArcadeDBHttpPort}"

          # Conditionally add plugins if provided
          if [ -n "${ArcadeDBPlugins}" ]; then
            SETTINGS="$SETTINGS -Darcadedb.server.plugins=${ArcadeDBPlugins}"
          fi

          # Append any extra user-provided JVM settings
          if [ -n "${ArcadeDBJavaOpts}" ]; then
            SETTINGS="$SETTINGS ${ArcadeDBJavaOpts}"
          fi

          # Build JAVA_OPTS with RAM setting
          JAVA_OPTS="-Xms512m -Xmx${ArcadeDBMaxRAM}m -XX:+UseG1GC"

          # Create systemd override (canonical way to pass config to ArcadeDB)
          mkdir -p /etc/systemd/system/arcadedb.service.d
          cat > /etc/systemd/system/arcadedb.service.d/override.conf << CONF
          [Service]
          Environment="ARCADEDB_SETTINGS=$SETTINGS"
          Environment="JAVA_OPTS=$JAVA_OPTS"
          CONF

          systemctl daemon-reload
          systemctl start arcadedb
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-instance'
        - Key: Application
          Value: ArcadeDB
        - Key: Version
          Value: !Ref ArcadeDBVersion

  ArcadeDBRecoveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateIam
    Properties:
      AlarmDescription: Trigger recovery when instance status check fails
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref ArcadeDBInstance
      AlarmActions:
        - !Sub 'arn:aws:automate:${AWS::Region}:ec2:recover'

Outputs:
  InstanceId:
    Description: Instance ID of ArcadeDB server
    Value: !Ref ArcadeDBInstance
    Export:
      Name: !Sub '${AWS::StackName}-InstanceId'

  PublicIP:
    Description: Public IP address of ArcadeDB server
    Value: !GetAtt ArcadeDBInstance.PublicIp

  PrivateIP:
    Description: Private IP address of ArcadeDB server
    Value: !GetAtt ArcadeDBInstance.PrivateIp

  StudioURL:
    Description: URL for ArcadeDB Studio
    Value: !Sub 'http://${ArcadeDBInstance.PublicIp}:${ArcadeDBHttpPort}'

  APIURL:
    Description: URL for ArcadeDB API
    Value: !Sub 'http://${ArcadeDBInstance.PublicIp}:${ArcadeDBHttpPort}/api/v1'

  SecurityGroupId:
    Description: Security Group ID
    Value: !If [CreateSecurityGroup, !Ref ArcadeDBSecurityGroup, !Ref ExistingSecurityGroupId]
    Export:
      Name: !Sub '${AWS::StackName}-SecurityGroupId'

  SSHCommand:
    Description: SSH command to connect to instance
    Value: !Sub 'ssh -i your-key.pem ubuntu@${ArcadeDBInstance.PublicIp}'
